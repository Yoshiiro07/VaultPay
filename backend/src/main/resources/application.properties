spring.application.name=vaultpay

# Configuração da DataSource do SQLite
spring.datasource.url=jdbc:sqlite:D:/Projetos/VaultPay/backend/vaultpay.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Configuração do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false


# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom VaultPay Messaging Properties
vaultpay.rabbitmq.exchange=vaultpay.transactions.exchange
vaultpay.rabbitmq.routingkey.debit=transaction.debited